<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vedøy Booking</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#09110f;color:#f4f7f5}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 10%,#183c32,transparent 38%),#09110f}.card{width:min(680px,calc(100% - 48px));padding:48px;border:1px solid #315b50;border-radius:24px;background:#0d1815dd;box-shadow:0 24px 80px #0008}.eyebrow{color:#6ee7b7;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem}h1{font-size:clamp(2.5rem,8vw,5rem);letter-spacing:-.06em;margin:.25em 0}.status{display:flex;align-items:center;gap:10px;color:#a7f3d0}.dot{width:9px;height:9px;border-radius:50%;background:#34d399;box-shadow:0 0 18px #34d399}pre{overflow:auto;padding:20px;border-radius:14px;background:#050907;color:#b7dfd1;font-size:.78rem;line-height:1.6}a{color:#6ee7b7}</style>
</head>
<body><main class="card"><div class="eyebrow">Fra Vedøy på Bleikemyr</div><h1>Booking­motor.</h1><p>Konfliktkontroll, tilgjengelighet, bookingstatus og tidsbuffere som en selvstendig tjeneste.</p><p class="status"><span class="dot"></span><span id="status">Kobler til API …</span></p><pre id="output">Laster /api/demo</pre><a href="/api/demo">Åpne API-respons →</a></main><script>fetch('/api/demo').then(r=>r.json()).then(data=>{status.textContent='API kjører';output.textContent=JSON.stringify(data,null,2)}).catch(()=>{status.textContent='API utilgjengelig';output.textContent='Kunne ikke hente demo.'})</script></body>
</html>
